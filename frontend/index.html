<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureNote Tool</title>
    <meta name="description" content="A lightweight, secure internal tool for managing notes.">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Dynamic notification toaster -->
    <div id="toast-container"></div>

    <!-- Animated background gradients -->
    <div class="background-gradients">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Navigation Bar -->
    <header class="navbar glassmorphism">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" class="lock-icon" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <h1>SecureNote</h1>
        </div>
        <div class="token-container">
            <svg viewBox="0 0 24 24" class="key-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
            </svg>
            <input type="password" id="auth-token" placeholder="Secret Token" class="token-input" autocomplete="off" title="Enter the secret token defined in the backend .env">
        </div>
    </header>

    <main class="container">
        <!-- Create Note Section -->
        <section class="add-note-section glassmorphism">
            <h2>Create New Note</h2>
            <form id="note-form">
                <div class="input-group">
                    <label for="note-title">Title</label>
                    <input type="text" id="note-title" placeholder="e.g., Database Passwords" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="note-content">Note Content</label>
                    <textarea id="note-content" placeholder="Secure information goes here..." rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-primary" id="submit-note">
                    <span>Securely Save Note</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </form>
        </section>

        <!-- Display Notes Section -->
        <section class="notes-list-section">
            <div class="section-header">
                <h2>Your Notes</h2>
                <div class="badge" id="note-count">0</div>
            </div>
            
            <!-- Loading Indicator -->
            <div id="loading" class="hidden">
                <div class="spinner"></div>
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="empty-state hidden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p>No notes found. Try creating one above.</p>
            </div>
            
            <!-- Notes Grid -->
            <div class="notes-grid" id="notes-grid">
               <!-- JavaScript will dynamically inject note cards here -->
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
